services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # Development runtime; diagnostic opt-in is read from .env.
    environment:
      NODE_ENV: development
      PORT: "3000"
    ports:
      - "${HOST_PORT:-3000}:3000"
    init: true
    # HTTP drain and Mongo cleanup can each take DATABASE_TIMEOUT_MS.
    stop_grace_period: 130s
    restart: unless-stopped
