name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl --fail --request POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keep_alive" \
            --header "apikey: ${{ secrets.SUPABASE_KEY }}" \
            --header "Content-Type: application/json" \
            --data '{}'